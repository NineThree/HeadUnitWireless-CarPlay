name: Android source checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintGolfDebug :mobile:lintUniversalDebug :mobile:assembleGolfDebug :mobile:assembleUniversalDebug
